<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZeroVault</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 40px;
        }

        .container {
            border: 1px solid #ccc;
            border-radius: 12px;
            padding: 30px;
            margin-top: 30px;
        }

        input {
            margin: 15px;
            padding: 10px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>ZeroVault</h1>

    <p>Secure Zero-Knowledge File Storage</p>

    <div class="container">

        <h2>Encrypt & Store File</h2>

        <input type="file" id="fileInput">

        <br>

        <input
            type="password"
            id="password"
            placeholder="Enter encryption password"
        >

        <br>

        <button id="uploadButton">
            Encrypt & Store
        </button>

        <p id="status"></p>

    </div>


    <script>

        const fileInput = document.getElementById("fileInput");
        const passwordInput = document.getElementById("password");
        const uploadButton = document.getElementById("uploadButton");
        const status = document.getElementById("status");


        // Convert password into an AES-256 encryption key
        async function deriveKey(password, salt) {

            const encoder = new TextEncoder();

            const passwordKey = await crypto.subtle.importKey(
                "raw",
                encoder.encode(password),
                "PBKDF2",
                false,
                ["deriveKey"]
            );

            return crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: 100000,
                    hash: "SHA-256"
                },
                passwordKey,
                {
                    name: "AES-GCM",
                    length: 256
                },
                false,
                ["encrypt", "decrypt"]
            );
        }


        // Encrypt file and send ONLY encrypted data to server
        uploadButton.addEventListener("click", async () => {

            const file = fileInput.files[0];
            const password = passwordInput.value;


            if (!file) {
                status.textContent = "Please select a file.";
                return;
            }


            if (!password) {
                status.textContent = "Please enter a password.";
                return;
            }


            try {

                status.textContent = "Encrypting file locally...";


                // Read original file
                const fileData = await file.arrayBuffer();


                // Generate random salt
                const salt = crypto.getRandomValues(
                    new Uint8Array(16)
                );


                // Generate random IV
                const iv = crypto.getRandomValues(
                    new Uint8Array(12)
                );


                // Create AES key from password
                const key = await deriveKey(
                    password,
                    salt
                );


                // Encrypt file in the browser
                const encryptedData = await crypto.subtle.encrypt(
                    {
                        name: "AES-GCM",
                        iv: iv
                    },
                    key,
                    fileData
                );


                /*
                    Store:

                    [ salt ][ IV ][ encrypted data ]

                    The server receives only this encrypted data.
                */

                const encryptedBlob = new Blob(
                    [
                        salt,
                        iv,
                        encryptedData
                    ],
                    {
                        type: "application/octet-stream"
                    }
                );


                status.textContent =
                    "Uploading encrypted file...";


                // Create multipart form
                const formData = new FormData();

                formData.append(
                    "file",
                    encryptedBlob,
                    file.name + ".encrypted"
                );


                // Send encrypted file to FastAPI
                const response = await fetch(
                    "http://127.0.0.1:8000/store-encrypted",
                    {
                        method: "POST",
                        body: formData
                    }
                );


                const result = await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.detail || "Upload failed."
                    );

                }


                console.log("Server response:", result);


                status.textContent =
                    "Encrypted file stored successfully!";


                console.log(
                    "Original filename:",
                    file.name
                );

                console.log(
                    "Encrypted filename:",
                    result.filename
                );

                console.log(
                    "Original size:",
                    fileData.byteLength
                );

                console.log(
                    "Encrypted size:",
                    encryptedData.byteLength
                );


            } catch (error) {

                console.error(error);

                status.textContent =
                    "Error: " + error.message;

            }

        });

    </script>

</body>
</html>
